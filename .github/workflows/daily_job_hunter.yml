name: Daily Job Hunter

on:
  schedule:
    # Morning: ~8:18 AM IST (02:48 UTC - off-peak minute to avoid GitHub Actions queue delays)
    - cron: '48 2 * * *'
    # Afternoon: ~3:48 PM IST (10:18 UTC - off-peak minute to avoid GitHub Actions queue delays)
    - cron: '18 10 * * *'
  # Allows you to manually trigger the job hunt anytime from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hunt_jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Job Hunter
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_MATCH_SCORE: "7"
          MAX_JOBS_PER_RUN: "10"
        run: |
          python main.py

      - name: Commit updated seen_jobs history
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f "data/seen_jobs.json" ]; then
            git add data/seen_jobs.json
            git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update seen jobs history [skip ci]" && git push)
          fi
