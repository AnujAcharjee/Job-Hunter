name: Daily Tech Internship Hunter

on:
  schedule:
    # Daily at 9:00 AM IST (03:30 AM UTC)
    - cron: '30 3 * * *'
  # Allows manual triggering from GitHub Actions UI anytime
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hunt_internships:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Internship Hunter
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_MATCH_SCORE: "8"
          MAX_JOBS_PER_RUN: "0"
        run: |
          python main.py

      - name: Commit updated seen_jobs history
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f "data/seen_jobs.json" ]; then
            git add data/seen_jobs.json
            git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update seen jobs history [skip ci]" && git push)
          fi
